<header>
  <h1> Produit</h1>
  <nav>
    <a href="#">Acceuil</a> / <a href="#">Produits</a>
  </nav>
  <br>
</header>
<br>
<div >
  <div class="container">

    <div class="row">
      <div class="col-lg-12 col-md-12">
        <div class="row">
          <div class="col-md-4 col-sm-12"  *ngFor="let u of paginatedProduits" >

            <div class="blog grid-modern" >
              <div class="blog-image">
                <a>
                  <img class="img-fluid responsive-image" [src]="'http://localhost:8082/image/'+u.picture" alt >
                </a>

              </div>
              <div class="blog-modern-box">
                <h3 class="blog-title">{{u.libelle}}</h3>
                <div class="blog-info clearfix mb-0">
                  <div class="post-left">
                    <ul>
                      <li><img class="img-fluid" src="/assets/img/icon/icon-22.svg" alt>Créer à : {{u.creationDate|date:'yyy-MM-dd HH'}}</li>
                      <li><img class="img-fluid" src="/assets/img/icon/icon-24.svg" alt>marque: {{u.marque}}</li>
                    </ul>
                  </div>
                </div>
                <button mat-raised-button color="warn"   (click)="OndeleteProduits(u.idProduit)">Supprimer</button>

                <button mat-raised-button color="primary"  >Modifier</button>
              </div></div></div>
        </div>
      </div></div>

  </div>
<hr>
</div>
<mat-paginator [length]="filtredproduits.length"
               [pageSize]="3"
               [pageSizeOptions]="[3,6,9,12]"
               (page)="handlePageEvent($event)"
>
</mat-paginator>
